<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="deposit.html"><i class="fas fa-money-bill-wave"></i> Deposit</a></li>
                    <li><a href="withdraw.html"><i class="fas fa-hand-holding-usd"></i> Withdraw</a></li>
                    <li><a href="history.html"><i class="fas fa-history"></i> History</a></li>
                    <li><a href="login.html" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</a></li>
                    <li><a href="signup.html" class="active" id="signupBtn"><i class="fas fa-user-plus"></i> Sign Up</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="auth-container">
                <h2>Create an Account</h2>
                <form id="signupForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                    </div>
                    <div class="form-group">
                        <label for="referralCode">Referral Code (Optional)</label>
                        <input type="text" id="referralCode" name="referralCode" placeholder="Enter referral code if you have one">
                    </div>
                    <button type="submit" class="form-btn">Sign Up</button>
                </form>
                <a href="login.html" class="auth-link">Already have an account? Login</a>
            </section>
        </main>

        <footer>
            <div class="footer-content">
                <div class="footer-logo">
                    <h2></h2>
                    <p>This site was created on 1 March 2023.</p>
                </div>
                <div class="footer-links">
                    <h3>Quick Links</h3>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="deposit.html">Deposit</a></li>
                        <li><a href="withdraw.html">Withdraw</a></li>
                        <li><a href="history.html">History</a></li>
                    </ul>
                </div>
                <div class="footer-contact">
                    <h3>Contact Us</h3>
                    <p><i class="fas fa-envelope"></i> support@example.com</p>
                    <p><i class="fas fa-phone"></i> +1 (123) 456-7890</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2023. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
